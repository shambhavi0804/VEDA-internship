<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="page">

        <section class="form-card">

            <!-- Header -->
            <div class="page-header">
                <div class="logo">P</div>

                <div>
                    <h1>Personal Profile</h1>
                    <p>Enter your information to create your profile</p>
                </div>
            </div>

            <!-- Form -->
            <form method="POST">

                <div class="form-grid">

                    <!-- Full Name -->
                    <div class="form-group full-width">
                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <!-- Age -->
                    <div class="form-group">
                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter your age"
                            min="1"
                            max="120"
                            inputmode="numeric"
                            required
                        >
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            autocomplete="tel"
                            inputmode="tel"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group full-width">
                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <!-- City -->
                    <div class="form-group">
                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Enter your city"
                            autocomplete="address-level2"
                            required
                        >
                    </div>

                    <!-- Occupation -->
                    <div class="form-group">
                        <label for="occupation">
                            Occupation
                        </label>

                        <input
                            type="text"
                            id="occupation"
                            name="occupation"
                            placeholder="Student / Developer"
                            required
                        >
                    </div>

                </div>

                <!-- Submit -->
                <button type="submit" class="submit-button">
                    Create Profile
                    <span>→</span>
                </button>

            </form>

            <p class="footer-text">
                Your information will be displayed as a profile.
            </p>

        </section>

    </main>

</body>
</html>
